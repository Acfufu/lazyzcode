name: Bug 报告（中文）
description: lazyzcode 出了故障，或行为与其文档契约不符。
labels: [bug]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前请确认
      options:
        - label: 我已搜索过现有 issue，没有找到重复报告
          required: true
        - label: 我了解目前仅支持 0.1.x 版本（见 SECURITY.md），旧版本不再修复
          required: true
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 同时说明你期望发生什么。
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: 复现步骤
      description: 从新终端开始的最小复现步骤。
      placeholder: |
        1. 在仓库 …
        2. 运行 `lzy …`
        3. 看到报错
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`lzy doctor` 输出"
      description: 本项目的本地诊断（无遥测），请贴全量输出——一次就能回答大部分环境问题。若 CLI 完全无法运行，请在此说明。
      render: text
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境信息
      description: |
        - 操作系统与架构（macOS / Windows / Linux；arm64 或 x64）
        - lazyzcode 版本（`lzy --version`）
        - Node 版本（`node --version`）
        - ZCode 桌面端版本
        - 安装方式（npm、`lzy update` 或市场安装）
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: 其他补充
