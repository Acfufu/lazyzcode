name: 功能建议（中文）
description: 为纪律层提出改动或新增能力。
labels: [enhancement]
body:
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前请确认
      options:
        - label: 我已搜索过现有 issue，没有找到相似提案
          required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题或使用场景
      description: 你想达成什么？现状让哪一步变难了？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 期望的行为是什么？请留意项目的表达层级——Skill > MCP > Tool > Hook——以及 AGENTS.md §5 的两条红线（永不改写用户 `config.json`；Stop 钩子预算共存）。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
  - type: checkboxes
    id: constitution
    attributes:
      label: 宪法核对
      description: AGENTS.md 是本仓库设计决策的单一事实入口。
      options:
        - label: 我已阅读 AGENTS.md，认为该建议符合项目设计规则（§5 红线、§8 术语表）
          required: true
