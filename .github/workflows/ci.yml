name: ci

# ADJ-90: read-only PR checks; SHA pinning and automatic updates land together in PR 05.
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-cancel-probe-${{ github.sha }}
  cancel-in-progress: false

jobs:
  test:
    concurrency:
      group: lzy-ci-probe-cancel-20261030
      cancel-in-progress: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        os: [ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Node runs --test "test/**/*.test.js" with spec/JUnit/event reporters and preserves its exit code.
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/test-${{ matrix.os }}/tests" --script scripts/ci/probe-hold.mjs
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/test-${{ matrix.os }}/cli" --script cli/lzy.js --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-${{ matrix.os }}/
          retention-days: 14

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/docs-links" --script scripts/check-docs-links.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-links-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-links/
          retention-days: 14

  sqlite-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/sqlite-floor/probe" --script scripts/sqlite-capability-probe.mjs
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/sqlite-floor/tests" test/statedb.contract.test.js test/statedb-readers.contract.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-floor-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-floor/
          retention-days: 14

  ci-required:
    name: CI Required
    if: always()
    needs: [test, docs-links, sqlite-floor]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci/required-gate.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: test,docs-links,sqlite-floor
