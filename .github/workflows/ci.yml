name: ci

# ADJ-90: read-only PR checks; SHA pinning and automatic updates land together in PR 05.
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      # Node runs --test "test/**/*.test.js" with spec/JUnit/event reporters and preserves its exit code.
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/test-${{ matrix.os }}/tests"
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/test-${{ matrix.os }}/cli" --script cli/lzy.js --help
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-${{ matrix.os }}/
          retention-days: 14

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/docs-links" --script scripts/check-docs-links.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: docs-links-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-links/
          retention-days: 14

  sqlite-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.0.0
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/sqlite-floor/probe" --script scripts/sqlite-capability-probe.mjs
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/sqlite-floor/tests" test/statedb.contract.test.js test/statedb-readers.contract.test.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sqlite-floor-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-floor/
          retention-days: 14

  package-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/package-build/runner" --script scripts/ci/package-build.mjs "${{ runner.temp }}/package-candidate"
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/package-build/counterexample-runner" --script scripts/ci/package-negative.mjs "${{ runner.temp }}/package-candidate" "${{ runner.temp }}/package-build/counterexamples"
      - uses: actions/upload-artifact@v4
        with:
          name: package-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-candidate/
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-build/
          retention-days: 14

  package-smoke:
    needs: package-build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '24'}
          - {os: windows-latest, node: '24'}
          - {os: macos-latest, node: '24'}
          - {os: ubuntu-latest, node: '24.0.0'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@v4
        with:
          name: package-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-candidate/
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/package-smoke/runner" --script scripts/ci/package-smoke.mjs "${{ runner.temp }}/package-candidate" "${{ runner.temp }}/package-smoke/reports"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: package-smoke-${{ matrix.os }}-${{ matrix.node }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-smoke/
          retention-days: 14

  ci-required:
    name: CI Required
    if: always()
    needs: [test, docs-links, sqlite-floor, package-build, package-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node scripts/ci/required-gate.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: test,docs-links,sqlite-floor,package-build,package-smoke
