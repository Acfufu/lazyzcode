name: ci

# ADJ-90: full action SHAs are maintained by grouped weekly Dependabot updates.
permissions:
  contents: read

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || format('push-{0}', github.sha) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: [24]
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      # Node runs --test "test/**/*.test.js" with spec/JUnit/event reporters and preserves its exit code.
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/test-${{ matrix.os }}/tests"
      - name: Isolated main-rule failure counterexample
        if: github.head_ref == 'codex/ci-rule-red-20261030' && matrix.os == 'ubuntu-latest'
        run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/test-${{ matrix.os }}/rule-fixture" scripts/ci/rule-red.fixture.mjs
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/test-${{ matrix.os }}/cli" --script cli/lzy.js --help
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: tests-${{ matrix.os }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-${{ matrix.os }}/
          retention-days: 14

  docs-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/docs-links" --script scripts/check-docs-links.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-links-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-links/
          retention-days: 14

  sqlite-floor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.0.0
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/sqlite-floor/probe" --script scripts/sqlite-capability-probe.mjs
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/sqlite-floor/tests" test/statedb.contract.test.js test/statedb-readers.contract.test.js
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: sqlite-floor-${{ github.run_attempt }}
          path: ${{ runner.temp }}/sqlite-floor/
          retention-days: 14

  package-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/package-build/runner" --script scripts/ci/package-build.mjs "${{ runner.temp }}/package-candidate"
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/package-build/counterexample-runner" --script scripts/ci/package-negative.mjs "${{ runner.temp }}/package-candidate" "${{ runner.temp }}/package-build/counterexamples"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: package-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-candidate/
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-build/
          retention-days: 14

  package-smoke:
    needs: package-build
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - {os: ubuntu-latest, node: '24'}
          - {os: windows-latest, node: '24'}
          - {os: macos-latest, node: '24'}
          - {os: ubuntu-latest, node: '24.0.0'}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: package-candidate-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-candidate/
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/package-smoke/runner" --script scripts/ci/package-smoke.mjs "${{ runner.temp }}/package-candidate" "${{ runner.temp }}/package-smoke/reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: package-smoke-${{ matrix.os }}-${{ matrix.node }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/package-smoke/
          retention-days: 14

  docs-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BUNDLE_GEMFILE: ${{ github.workspace }}/scripts/docs-jekyll/Gemfile
      JEKYLL_ENV: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: 3.3.4
          bundler: 2.5.11
          bundler-cache: true
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/docs-build" --script scripts/docs-jekyll/build.mjs "${{ runner.temp }}/docs-site"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: docs-build-${{ github.run_attempt }}
          path: ${{ runner.temp }}/docs-build/
          retention-days: 14

  workflow-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/ci/run-checks.mjs "${{ runner.temp }}/workflow-check/runner" --script scripts/ci/workflow-check.mjs "${{ runner.temp }}/workflow-check/reports"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: workflow-check-${{ github.run_attempt }}
          path: ${{ runner.temp }}/workflow-check/
          retention-days: 14

  ci-required:
    name: CI Required
    if: always()
    needs: [test, docs-links, sqlite-floor, package-build, package-smoke, docs-build, workflow-check]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: node scripts/ci/required-gate.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          REQUIRED_JOBS: test,docs-links,sqlite-floor,package-build,package-smoke,docs-build,workflow-check
