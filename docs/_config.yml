# LazyZCode GitHub Pages（source = 仓库 /docs 目录）
# 注意：若仓库改名或换组织，同步改下方 baseurl 与 docs/release-checklist.md 的对应条目。
title: LazyZCode
description: The discipline layer for ZCode — plan, execute, take evidence, never stop half-done.
url: https://acfufu.github.io
baseurl: /lazyzcode
markdown: GFM
highlighter: rouge
permalink: pretty

# 历史评审与证据档案不进站点构建：Liquid 会把正文中的 {{{ 误当模板语法炸掉整个构建；
# 这些是内部 QA 记录，GitHub 仓库页照常渲染，无需站点化。
exclude:
  - reviews
  - evidence
  - history.md

defaults:
  # 兜底：其余 md（adr/spikes/diagnostics/research 等内部工程记录）走 bare 布局，
  # 带 noindex 头——链接不断（guide 引用它们），但不进索引稀释精修页。
  - scope:
      path: ""
    values:
      layout: bare
  - scope:
      path: "guide/en.md"
    values:
      layout: guide
      lang: en
      title: Documentation
      description: Install LazyZCode and run your first goal loop in ZCode — plan gate, evidence bound to git tree hashes, trigger words, hooks, and the full lzy CLI reference.
  - scope:
      path: "guide/zh.md"
    values:
      layout: guide
      lang: zh
      title: 文档
      description: 安装 LazyZCode，在 ZCode 里跑通第一个目标循环——计划门、绑 tree hash 的证据、触发词、钩子与 lzy CLI 全参考。
  - scope:
      path: "developers/en.md"
    values:
      layout: page
      lang: en
      title: For developers
      description: How LazyZCode works under the hood — the plugin payload, hooks, discipline agents, and the lzy CLI internals, plus how to extend and contribute.
  - scope:
      path: "developers/zh.md"
    values:
      layout: page
      lang: zh
      title: 开发者视角
      description: LazyZCode 的底层机制——插件载荷、钩子、纪律角色与 lzy CLI 内部，以及如何扩展与贡献。
