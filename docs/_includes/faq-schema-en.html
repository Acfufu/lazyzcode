      "acceptedAnswer": { "@type": "Answer", "text": "In a .lazyzcode/ directory inside your project: loop state, plans, and archived evidence. It is deliberately separate from ZCode's own .zcode/ directory; add it to .gitignore if you do not want to commit it." }

      "@type": "Question",
      "name": "Does LazyZCode collect telemetry?",
      "acceptedAnswer": { "@type": "Answer", "text": "No. Zero telemetry. Everything lzy doctor reports is computed locally from your own files and engine logs." }

      "@type": "Question",
      "name": "Does LazyZCode write my config.json?",
      "acceptedAnswer": { "@type": "Answer", "text": "Never. Enabling goes through the engine's official plugins enable command; the installer only deploys files and writes LazyZCode's own registry." }

      "name": "Why didn't my zw trigger word fire?",
      "acceptedAnswer": { "@type": "Answer", "text": "Matching is stratified: a bare zw fires only at the start of a prompt; a mid-sentence zw is ignored on purpose. Use the explicit lazyzcode:zw anywhere, or ulw / ultrawork anywhere word-bounded." }

      "@type": "Question",
      "name": "Why did lzy loop finish reject my evidence?",
      "acceptedAnswer": { "@type": "Answer", "text": "Evidence is bound to the tree hash of the commit that was current when it was captured. If code changed after capture, the evidence is stale by construction: commit, then re-capture with lzy step done." }
