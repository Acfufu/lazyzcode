<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, follow">
  <title>{{ page.title | default: site.title }} — internal record</title>
  <meta name="description" content="Internal engineering record of the LazyZCode project.">
  <script>(function(){try{var t=localStorage.getItem("lzy-theme")||"auto";if(t==="auto")t=window.matchMedia&&matchMedia("(prefers-color-scheme: light)").matches?"light":"dark";document.documentElement.dataset.theme=t;}catch(e){}})();</script>
  <link rel="icon" type="image/svg+xml" href="{{ site.baseurl }}/assets/favicon.svg">
  <link rel="stylesheet" href="{{ site.baseurl }}/assets/docs.css">
  <script src="{{ site.baseurl }}/assets/theme.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="wrap header-inner">
      <a class="brand" href="{{ site.baseurl }}/"><img src="{{ site.baseurl }}/assets/mark.svg" alt="" width="22" height="22">LazyZCode</a>
      <nav class="header-nav">
        <a class="nav-link" href="{{ site.baseurl }}/guide/en/">Docs</a>
        <a class="btn" href="https://github.com/acfufu/lazyzcode">GitHub</a>
      </nav>
    </div>
  </header>

  <div class="wrap layout" style="grid-template-columns:1fr">
    <main class="content">
      {{ content }}
    </main>
  </div>

  <footer class="site-footer">
    <div class="wrap">
      <p>MIT License · <a href="https://github.com/acfufu/lazyzcode">github.com/acfufu/lazyzcode</a></p>
    </div>
  </footer>
</body>
</html>
